<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Shooter Demo - 《向僵尸开炮》</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; user-select: none; }
        #game-container { position: relative; width: 800px; height: 600px; margin: 20px auto; border: 4px solid #444; background: #111; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        canvas { display: block; }
        #hud { position: absolute; top: 10px; left: 10px; font-size: 18px; text-shadow: 2px 2px #000; padding: 5px 10px; background: rgba(0,0,0,0.3); border-radius: 5px; }
        #upgrade-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 20, 0.95); padding: 25px; border: 3px solid #0ff; border-radius: 15px; text-align: center; width: 450px; z-index: 100; box-shadow: 0 0 30px #0ff5; }
        .skill-option { background: #1a1a2e; border: 1px solid #333; padding: 15px; margin: 12px 0; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
        .skill-option:hover { background: #16213e; border-color: #0ff; transform: scale(1.02); }
        .skill-name { font-weight: bold; color: #0ff; margin-bottom: 5px; font-size: 18px; }
        .skill-desc { font-size: 14px; color: #aaa; }
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f1b; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        .city-stats { display: flex; gap: 30px; margin: 20px 0; padding: 15px; background: #1a1a2e; border-radius: 10px; border: 1px solid #333; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; }
        .stat-value { font-size: 24px; color: #fbc531; font-weight: bold; }
        button.start-btn { padding: 18px 50px; font-size: 24px; background: linear-gradient(135deg, #00b894, #006266); color: #fff; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,184,148,0.3); transition: all 0.3s; margin-top: 20px; }
        button.start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,184,148,0.5); filter: brightness(1.2); }
        h1 { margin-bottom: 5px; letter-spacing: 2px; text-shadow: 0 0 10px #0ff; }
        .subtitle { color: #888; margin-bottom: 30px; font-style: italic; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud">
            HP: <span id="hp">100</span> | Wave: <span id="wave">1</span> | Enemies: <span id="enemies">0</span>
        </div>
        <div id="upgrade-modal">
            <h2 style="margin-top:0">选择强化词条</h2>
            <div id="options-container"></div>
        </div>
        <div id="menu-overlay">
            <h1>向僵尸开炮 DEMO</h1>
            <div class="subtitle">ROGUE-LIKE TOWER DEFENSE</div>

            <div class="city-stats">
                <div class="stat-item">
                    <div class="stat-label">黄金储备</div>
                    <div class="stat-value" id="city-gold">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">最高波次</div>
                    <div class="stat-value" id="city-wave">0</div>
                </div>
            </div>

            <button class="start-btn" onclick="startGame()">开始战斗</button>
        </div>
    </div>
    <script src="dist/bundle.js"></script>
</body>
</html>
